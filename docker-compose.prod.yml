services:
  springboot-postgresql-app:
    image: ${APP_IMAGE:?set immutable APP_IMAGE}
    profiles: ["production"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_POSTGRES_R2DBC_URL: ${APP_POSTGRES_R2DBC_URL:?set protected application PostgreSQL URL}
      REDIS_HOST: ${REDIS_HOST:?set private Redis host}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_SECRET_PROVIDER: openbao
      OPENBAO_ADDR: ${OPENBAO_ADDR:?set private TLS OpenBao URL}
      OPENBAO_ROLE: ${OPENBAO_ROLE:?set environment-scoped OpenBao role}
      OPENBAO_AUTH_METHOD: approle-agent
      APP_FILE_STORAGE_PROVIDER: s3
      APP_FILE_STORAGE_S3_ENDPOINT: ${APP_FILE_STORAGE_S3_ENDPOINT:?set TLS object-storage endpoint}
      APP_FILE_STORAGE_S3_BUCKET: ${APP_FILE_STORAGE_S3_BUCKET:?set bucket}
      APP_AUDIT_OUTBOX_ENABLED: ${APP_AUDIT_OUTBOX_ENABLED:-false}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
    volumes:
      - /run/auto-parto/secrets:/run/auto-parto/secrets:ro
      - /run/auto-parto/audit:/run/auto-parto/audit:ro
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [application-backend, tls-origin]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 3s
      retries: 3

networks:
  application-backend:
    name: auto-parto-app-backend
    external: true
  tls-origin:
    name: auto-parto-tls-origin
    external: true
