services:
  springboot-postgresql-app:
    image: ${APP_IMAGE:?set immutable APP_IMAGE}
    profiles: ["production"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MANAGEMENT_SERVER_PORT: 8081
      OTEL_TRACES_EXPORT_ENABLED: ${OTEL_TRACES_EXPORT_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-0.05}
      APP_POSTGRES_R2DBC_URL: ${APP_POSTGRES_R2DBC_URL:?set protected application PostgreSQL URL}
      REDIS_HOST: ${REDIS_HOST:?set private Redis host}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_FILE_STORAGE_PROVIDER: s3
      APP_FILE_STORAGE_S3_ENDPOINT: ${APP_FILE_STORAGE_S3_ENDPOINT:?set TLS object-storage endpoint}
      APP_FILE_STORAGE_S3_BUCKET: ${APP_FILE_STORAGE_S3_BUCKET:?set bucket}
      APP_AUDIT_OUTBOX_ENABLED: ${APP_AUDIT_OUTBOX_ENABLED:-false}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
    volumes:
      - type: bind
        source: /run/auto-parto/active
        target: /run/auto-parto
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [application-backend, tls-origin, observability]
    expose: ["8080", "8081"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 20s
      timeout: 3s
      retries: 3

networks:
  application-backend:
    name: auto-parto-app-backend
    external: true
  tls-origin:
    name: auto-parto-tls-origin
    external: true
  observability:
    name: auto-parto-observability
    external: true
