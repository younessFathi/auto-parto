spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/auto-parto}
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:root}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
auth:
  provider: otp
  google:
    enabled: false
  clerk:
    enabled: false
otp:
  expiration:
    minutes: 5
security:
  otp:
    pepper: ${OTP_PEPPER:}
auto:
  parto:
    persistence:
      postgresql:
        enabled: ${APP_POSTGRES_R2DBC_ENABLED:${APP_POSTGRES_IDENTITY_ENABLED:${APP_POSTGRES_BUYER_IDENTITY_ENABLED:false}}}
        identity:
          enabled: ${APP_POSTGRES_IDENTITY_ENABLED:false}
        buyer-identity:
          enabled: ${APP_POSTGRES_BUYER_IDENTITY_ENABLED:false}
    images:
      uploads: ../uploads

jwt:
  secretKey: ${JWT_SECRET}
  expiration: 60000
