spring:
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: auto-parto
      authentication-database: admin
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:root}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      cache:
        type: redis
        redis:
          time-to-live: 600000 # 10 minutes
  :mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

opt:
  expiration:
    minutes: 5

auto:
  parto:
    images:
      uploads: ../uploads

jwt:
  secretKey: ${SECRET_KEY}
  expiration: 5

twilio:
  sid: ${TWILIO_SID}
  auth: ${TWILIO_AUTH}

