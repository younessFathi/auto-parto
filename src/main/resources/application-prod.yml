spring:
  config:
    import:
      - file:/run/auto-parto/secrets/secrets.properties
      - optional:file:/run/auto-parto/audit/secrets.properties
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${APP_REDIS_COMMAND_TIMEOUT:3s}
      ssl:
        enabled: true
        bundle: redis
      lettuce:
        pool:
          max-active: ${APP_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${APP_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${APP_REDIS_POOL_MIN_IDLE:0}
          max-wait: ${APP_REDIS_POOL_MAX_WAIT:3s}
  r2dbc:
    url: ${APP_POSTGRES_R2DBC_URL}
    pool:
      enabled: true
      initial-size: 0
      max-size: ${APP_POSTGRES_R2DBC_POOL_MAX_SIZE:10}
      max-acquire-time: ${APP_POSTGRES_R2DBC_POOL_MAX_ACQUIRE_TIME:5s}
      max-create-connection-time: ${APP_POSTGRES_R2DBC_POOL_CONNECT_TIMEOUT:5s}
      max-idle-time: 30m
      max-life-time: 30m

  ssl:
    bundle:
      pem:
        redis:
          truststore:
            certificate: ${APP_REDIS_TLS_CA_FILE}

auto:
  parto:
    persistence:
      postgresql:
        enabled: true
        identity:
          enabled: true
        buyer-identity:
          enabled: true
        marketplace:
          enabled: true
        wallet:
          enabled: true
        device-tokens:
          enabled: true
        notifications:
          enabled: true
        files:
          enabled: true
        notification-preferences:
          enabled: true
        cutover:
          enabled: true
          api-contracts-ready: true
          mongo-disabled: true
          storage-reconciliation:
            enabled: true
    storage:
      provider: ${APP_FILE_STORAGE_PROVIDER}
      s3:
        endpoint: ${APP_FILE_STORAGE_S3_ENDPOINT}
        bucket: ${APP_FILE_STORAGE_S3_BUCKET}
    audit:
      enabled: ${APP_AUDIT_OUTBOX_ENABLED:false}
      r2dbc-url: ${AUDIT_POSTGRES_R2DBC_URL:}
      max-connections: ${AUDIT_POSTGRES_POOL_MAX_SIZE:4}
      max-acquire-time: ${AUDIT_POSTGRES_POOL_MAX_ACQUIRE_TIME:5s}
      max-create-connection-time: ${AUDIT_POSTGRES_POOL_CONNECT_TIMEOUT:5s}

jwt:
  secretKey: ""

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials:
    path: ""

resend:
  enable: ${RESEND_ENABLED:false}

app:
  firebase:
    components-enabled: false
