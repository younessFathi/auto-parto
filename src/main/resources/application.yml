logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${URI:-mongodb://localhost:27017/auto-parto}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:-}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      database: 0
  r2dbc:
    url: ${APP_POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/auto_parto}
    username: ${APP_POSTGRES_USER:auto_parto}
    password: ${APP_POSTGRES_PASSWORD:}
    pool:
      enabled: true
      initial-size: 0
      max-size: ${APP_POSTGRES_R2DBC_POOL_MAX_SIZE:10}
      max-idle-time: 30m
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
auth:
  provider: otp
  google:
    enabled: false
  clerk:
    enabled: false
otp:
  expiration:
    minutes: 5
  template: classpath:templates/otp-template.html
  subject: Verify your Auto Parto account
  from: onboarding@resend.dev
security:
  otp:
    pepper: ${OTP_PEPPER:}
auto:
  parto:
    persistence:
      postgresql:
        enabled: ${APP_POSTGRES_R2DBC_ENABLED:${APP_POSTGRES_IDENTITY_ENABLED:${APP_POSTGRES_BUYER_IDENTITY_ENABLED:false}}}
        cutover:
          enabled: ${APP_POSTGRES_CUTOVER_ENABLED:false}
          api-contracts-ready: ${APP_POSTGRES_CUTOVER_API_CONTRACTS_READY:false}
          mongo-disabled: ${APP_POSTGRES_MONGO_DISABLED:false}
          storage-reconciliation:
            enabled: ${APP_POSTGRES_CUTOVER_STORAGE_RECONCILIATION_ENABLED:false}
            max-files: ${APP_POSTGRES_CUTOVER_STORAGE_RECONCILIATION_MAX_FILES:1000}
            timeout: ${APP_POSTGRES_CUTOVER_STORAGE_RECONCILIATION_TIMEOUT:30s}
        identity:
          enabled: ${APP_POSTGRES_IDENTITY_ENABLED:false}
        buyer-identity:
          enabled: ${APP_POSTGRES_BUYER_IDENTITY_ENABLED:false}
        marketplace:
          enabled: ${APP_POSTGRES_MARKETPLACE_ENABLED:false}
        wallet:
          enabled: ${APP_POSTGRES_WALLET_ENABLED:false}
        device-tokens:
          enabled: ${APP_POSTGRES_DEVICE_TOKENS_ENABLED:false}
        notifications:
          enabled: ${APP_POSTGRES_NOTIFICATIONS_ENABLED:false}
        files:
          enabled: ${APP_POSTGRES_FILES_ENABLED:false}
        notification-preferences:
          enabled: ${APP_POSTGRES_NOTIFICATION_PREFERENCES_ENABLED:false}
    audit:
      enabled: ${APP_AUDIT_OUTBOX_ENABLED:false}
      r2dbc-url: ${AUDIT_POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/auto_parto_audit}
      username: ${AUDIT_POSTGRES_RUNTIME_USER:}
      password: ${AUDIT_POSTGRES_RUNTIME_PASSWORD:}
      worker-id: ${AUDIT_OUTBOX_WORKER_ID:audit-worker}
      batch-size: ${AUDIT_OUTBOX_BATCH_SIZE:100}
      poll-interval: ${AUDIT_OUTBOX_POLL_INTERVAL:1s}
      lease-duration: ${AUDIT_OUTBOX_LEASE_DURATION:30s}
      max-attempts: ${AUDIT_OUTBOX_MAX_ATTEMPTS:3}
      max-concurrency: ${AUDIT_OUTBOX_MAX_CONCURRENCY:4}
      base-retry-delay: ${AUDIT_OUTBOX_BASE_RETRY_DELAY:2s}
      max-retry-delay: ${AUDIT_OUTBOX_MAX_RETRY_DELAY:1m}
      reconciliation-interval: ${AUDIT_OUTBOX_RECONCILIATION_INTERVAL:5m}
      reconciliation-lookback: ${AUDIT_OUTBOX_RECONCILIATION_LOOKBACK:1d}
      cleanup-interval: ${AUDIT_OUTBOX_CLEANUP_INTERVAL:1h}
    images:
      uploads: ../uploads
    storage:
      provider: ${APP_FILE_STORAGE_PROVIDER:local}
      max-upload-bytes: ${APP_FILE_STORAGE_MAX_UPLOAD_BYTES:10485760}
      local:
        root: ${APP_FILE_STORAGE_LOCAL_ROOT:${auto.parto.images.uploads}}
      s3:
        endpoint: ${APP_FILE_STORAGE_S3_ENDPOINT:http://localhost:8333}
        region: ${APP_FILE_STORAGE_S3_REGION:us-east-1}
        bucket: ${APP_FILE_STORAGE_S3_BUCKET:auto-parto-files}
        access-key: ${APP_FILE_STORAGE_S3_ACCESS_KEY:}
        secret-key: ${APP_FILE_STORAGE_S3_SECRET_KEY:}
        max-concurrency: ${APP_FILE_STORAGE_S3_MAX_CONCURRENCY:32}
    executor:
      retry:
        pool-size: 3
      notification-retry:
        pool-size: 2

jwt:
  secretKey: ${JWT_SECRET}
  expiration: 3600_000

notification:
  timeout: 100
  sse:
    max-connections: 1000
    buffer-size: 1000
  redis:
    pending-prefix: "notification:pending:"
    ttl-hours: 24
    max-pending-per-user: 100

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials:
    json: ${FIREBASE_CREDENTIALS_JSON:}
  messaging:
    timeout: 10s
    retry:
      max-attempts: 3
      backoff-delay: 1000
    circuit-breaker:
      failure-threshold: 5
      reset-timeout: 30000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full

resend:
  api-key: ${REDACTED_CREDENTIAL:}
  enable: false
