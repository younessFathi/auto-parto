logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${URI:-mongodb://localhost:27017/auto-parto}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:-}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      database: 0
  r2dbc:
    url: ${APP_POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/auto_parto}
    username: ${APP_POSTGRES_USER:auto_parto}
    password: ${APP_POSTGRES_PASSWORD:}
    pool:
      enabled: true
      initial-size: 0
      max-size: ${APP_POSTGRES_R2DBC_POOL_MAX_SIZE:10}
      max-idle-time: 30m
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
auth:
  provider: otp
  google:
    enabled: false
  clerk:
    enabled: false
otp:
  expiration:
    minutes: 5
  template: classpath:templates/otp-template.html
  subject: Verify your Auto Parto account
  from: onboarding@resend.dev
security:
  otp:
    pepper: ${OTP_PEPPER:}
auto:
  parto:
    persistence:
      postgresql:
        enabled: ${APP_POSTGRES_R2DBC_ENABLED:${APP_POSTGRES_IDENTITY_ENABLED:${APP_POSTGRES_BUYER_IDENTITY_ENABLED:false}}}
        identity:
          enabled: ${APP_POSTGRES_IDENTITY_ENABLED:false}
        buyer-identity:
          enabled: ${APP_POSTGRES_BUYER_IDENTITY_ENABLED:false}
    images:
      uploads: ../uploads
    executor:
      retry:
        pool-size: 3
      notification-retry:
        pool-size: 2

jwt:
  secretKey: ${JWT_SECRET}
  expiration: 3600_000

notification:
  timeout: 100
  sse:
    max-connections: 1000
    buffer-size: 1000
  redis:
    pending-prefix: "notification:pending:"
    ttl-hours: 24
    max-pending-per-user: 100

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials:
    json: ${FIREBASE_CREDENTIALS_JSON:}
  messaging:
    timeout: 10s
    retry:
      max-attempts: 3
      backoff-delay: 1000
    circuit-breaker:
      failure-threshold: 5
      reset-timeout: 30000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full

resend:
  api-key: ${RESEND_API_KEY}
  enable: false
