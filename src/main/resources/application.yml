spring:
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: auto-parto
      authentication-database: admin
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:root}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
opt:
  expiration:
    minutes: 5
auto:
  parto:
    images:
      uploads: ../uploads

