spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${URI:mongodb://root:root@mongo:27017/auto-parto?authSource=admin}
      database: ${DB_NAME:auto-parto}
      authentication-database: admin
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:root}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
  security:
    oauth2:
      client:
        registration:
          google: ${REDACTED_CREDENTIAL:}
            client-id: ${REDACTED_CREDENTIAL:}
            client-secret: ${REDACTED_CREDENTIAL:}
            scope:
              - openid
              - profile
              - email
        provider:
          google: ${REDACTED_CREDENTIAL:}
            issuer-uri: https://accounts.google.com
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
opt:
  expiration:
    minutes: 5
auto:
  parto:
    images:
      uploads: ../uploads

