spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auto-parto
  data:
    mongodb:
      uri: ${URI}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      database: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${REDACTED_CREDENTIAL:}
            client-secret: ${REDACTED_CREDENTIAL:}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: https://accounts.google.com
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
opt:
  expiration:
    minutes: 5
auto:
  parto:
    images:
      uploads: ../uploads

jwt:
  secretKey: ${JWT_SECRET}
  expiration: 3600_000

notification:
  timeout: 100
  redis:
    pending-prefix: "notification:pending:"
    ttl-hours: 24
    max-pending-per-user: 100

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials:
    json: ${FIREBASE_CREDENTIALS_JSON:}
  messaging:
    retry:
      max-attempts: 3
      backoff-delay: 1000
    circuit-breaker:
      failure-threshold: 5
      reset-timeout: 30000
resend:
  api-key: ${REDACTED_CREDENTIAL:}
  enable: false

otp:
  template: classpath:templates/otp-template.html
  subject: Verify your Auto Parto account
  from: onboarding@resend.dev

