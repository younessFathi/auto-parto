---
- name: Stage and activate encrypted, role-scoped Auto-Parto secret bundles
  hosts: secret_bundle_targets
  gather_facts: false
  become: true
  serial: 1

  vars:
    secret_role_roots:
      application: /run/auto-parto
      application_database: /run/auto-parto-db
      audit_database: /run/auto-parto-audit
      object_storage: /run/auto-parto-object-storage
      migration_runner: /run/auto-parto-migration
    secret_bundle_paths:
      application-runtime: secrets/secrets.properties
      audit-runtime: audit/secrets.properties
      database-bootstrap: database/bootstrap.properties
      backup: backup/secrets.properties
      audit-admin: database/audit-admin.properties
      object-storage-admin: object-storage/admin.properties
      migration: migration/secrets.properties

  pre_tasks:
    - name: Require a declared role and bundle set
      ansible.builtin.assert:
        that:
          - secret_target_role is defined
          - secret_target_role in secret_role_roots
          - vault_bundles is defined
          - vault_bundles is sequence
          - vault_bundles is not string
          - vault_bundles | length > 0
        quiet: true
      no_log: true

    - name: Require known bundle roles and fixed destinations
      ansible.builtin.assert:
        that:
          - item.source is defined
          - item.role is defined
          - item.role in secret_bundle_paths
          - item.generation_path is defined
          - item.generation_path == secret_bundle_paths[item.role]
        quiet: true
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Require numeric service group identifiers before conversion
      ansible.builtin.assert:
        that:
          - item.gid is integer or (item.gid is string and item.gid is match('^[0-9]+$'))
        quiet: true
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Require group identifiers in the supported non-root range
      ansible.builtin.assert:
        that:
          - item.gid | int > 0
          - item.gid | int <= 4294967294
          - item.role not in ['application-runtime', 'audit-runtime'] or item.gid | string == '10001'
        quiet: true
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Require bundle roles to match their target host role
      ansible.builtin.assert:
        that:
          - >-
            (secret_target_role == 'application' and item.role in ['application-runtime', 'audit-runtime']) or
            (secret_target_role == 'application_database' and item.role in ['database-bootstrap', 'backup']) or
            (secret_target_role == 'audit_database' and item.role == 'audit-admin') or
            (secret_target_role == 'object_storage' and item.role == 'object-storage-admin') or
            (secret_target_role == 'migration_runner' and item.role == 'migration')
        quiet: true
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Require exactly one application runtime bundle and unique destinations
      ansible.builtin.assert:
        that:
          - secret_target_role != 'application' or (vault_bundles | selectattr('role', 'equalto', 'application-runtime') | list | length == 1)
          - (vault_bundles | map(attribute='generation_path') | list | unique | list | length) == (vault_bundles | length)
        quiet: true
      no_log: true

    - name: Set fixed secret root and per-root lock path
      ansible.builtin.set_fact:
        secret_role_root: "{{ secret_role_roots[secret_target_role] }}"
        secret_lock_path: "/run/lock/auto-parto-secret-delivery-{{ secret_target_role }}"
      no_log: true

  tasks:
    - name: Serialize preflight, staging, activation, and failure cleanup for this secret root
      block:
        - name: Acquire exclusive host and secret-root lock
          ansible.builtin.command:
            argv:
              - mkdir
              - --
              - "{{ secret_lock_path }}"
          register: secret_lock_result
          changed_when: true
          no_log: true

        - name: Verify all declared controller-side sources exist and have Ansible Vault headers
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - "test -f \"$1\" && head -c 15 \"$1\" | grep -q '^\\$ANSIBLE_VAULT;'"
              - validate-vault-source
              - "{{ item.source }}"
          delegate_to: localhost
          become: false
          changed_when: false
          loop: "{{ vault_bundles }}"
          no_log: true

        - name: Compute a stable generation identifier from encrypted source bytes and bundle metadata
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ item.source }}"
          delegate_to: localhost
          become: false
          changed_when: false
          loop: "{{ vault_bundles | sort(attribute='generation_path') }}"
          register: vault_source_checksums
          no_log: true

        - name: Set generation identifier
          ansible.builtin.set_fact:
            secret_generation_id: "{{ (vault_source_checksums.results | map(attribute='stdout') | map('regex_replace', ' .*$', '') | join('') ~ (vault_bundles | to_json)) | hash('sha256') }}"
          no_log: true

        - name: Inspect active generation
          ansible.builtin.stat:
            path: "{{ secret_role_root }}/active"
            follow: false
          register: active_secret_generation
          no_log: true

        - name: Stage, validate, and activate one complete generation
          when: not (active_secret_generation.stat.islnk | default(false) and active_secret_generation.stat.lnk_target == ('generations/' ~ secret_generation_id))
          block:
            - name: Create private generation staging root
              ansible.builtin.file:
                path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}"
                state: directory
                owner: root
                group: root
                mode: "0711"
              no_log: true

            - name: Create each role-scoped directory in the inactive generation
              ansible.builtin.file:
                path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}/{{ item.generation_path | dirname }}"
                state: directory
                owner: root
                group: "{{ item.gid }}"
                mode: "0750"
              loop: "{{ vault_bundles }}"
              no_log: true

            - name: Decrypt every bundle into the inactive generation
              ansible.builtin.copy:
                src: "{{ item.source }}"
                dest: "{{ secret_role_root }}/generations/{{ secret_generation_id }}/{{ item.generation_path }}"
                owner: root
                group: "{{ item.gid }}"
                mode: "0440"
                decrypt: true
                backup: false
              loop: "{{ vault_bundles }}"
              diff: false
              no_log: true

            - name: Verify every staged bundle is a regular file with the expected numeric group and mode
              ansible.builtin.stat:
                path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}/{{ item.generation_path }}"
                follow: false
              loop: "{{ vault_bundles }}"
              register: staged_bundles
              no_log: true

            - name: Reject incomplete or incorrectly permissioned generations
              ansible.builtin.assert:
                that:
                  - item.stat.isreg | default(false)
                  - item.stat.pw_name == 'root'
                  - item.stat.gid | string == item.item.gid | string
                  - item.stat.mode == '0440'
                quiet: true
              loop: "{{ staged_bundles.results }}"
              no_log: true

            - name: Atomically activate the fully staged generation
              ansible.builtin.script:
                cmd: >-
                  {{ playbook_dir }}/activate-secret-generation.sh
                  {{ secret_role_root }} {{ secret_generation_id }}
                  {{ vault_bundles | map(attribute='generation_path') | join(' ') }}
              changed_when: true
              no_log: true

          rescue:
            - name: Inspect active generation before failed-stage cleanup
              ansible.builtin.stat:
                path: "{{ secret_role_root }}/active"
                follow: false
              register: failed_active_secret_generation
              no_log: true

            - name: Remove failed generation only when it is not the active target
              ansible.builtin.file:
                path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}"
                state: absent
              when: not (failed_active_secret_generation.stat.islnk | default(false) and failed_active_secret_generation.stat.lnk_source == (secret_role_root ~ '/generations/' ~ secret_generation_id))
              no_log: true

            - name: Fail deployment after preserving the live generation
              ansible.builtin.fail:
                msg: Secret bundle staging failed; the active generation was preserved.
              no_log: true

      always:
        - name: Release host and secret-root lock
          ansible.builtin.command:
            argv:
              - rmdir
              - --
              - "{{ secret_lock_path }}"
          when: secret_lock_result is defined and secret_lock_result is succeeded
          changed_when: true
          no_log: true
