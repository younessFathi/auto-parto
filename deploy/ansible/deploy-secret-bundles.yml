---
- name: Stage and activate encrypted, role-scoped Auto-Parto secret bundles
  hosts: secret_bundle_targets
  gather_facts: false
  become: true
  serial: 1

  vars:
    secret_role_roots:
      application: /run/auto-parto
      application_database: /run/auto-parto-db
      audit_database: /run/auto-parto-audit
      object_storage: /run/auto-parto-object-storage
      migration_runner: /run/auto-parto-migration
    secret_bundle_paths:
      application-runtime: secrets/secrets.properties
      audit-runtime: audit/secrets.properties
      database-bootstrap: database/bootstrap.properties
      backup: backup/secrets.properties
      audit-admin: database/audit-admin.properties
      object-storage-admin: object-storage/admin.properties
      migration: migration/secrets.properties

  tasks:
    - name: Require a declared role and bundle set
      ansible.builtin.assert:
        that:
          - secret_target_role is defined
          - secret_target_role in secret_role_roots
          - vault_bundles is defined
          - vault_bundles is sequence
          - vault_bundles is not string
          - vault_bundles | length > 0
        quiet: true
      no_log: true

    - name: Require exact role paths and compatible numeric groups
      ansible.builtin.assert:
        that:
          - item.source is defined
          - item.role is defined
          - item.gid is defined
          - item.gid | int >= 0
          - item.generation_path is defined
          - item.generation_path == secret_bundle_paths[item.role]
          - >-
            (secret_target_role == 'application' and item.role in ['application-runtime', 'audit-runtime']) or
            (secret_target_role == 'application_database' and item.role in ['database-bootstrap', 'backup']) or
            (secret_target_role == 'audit_database' and item.role == 'audit-admin') or
            (secret_target_role == 'object_storage' and item.role == 'object-storage-admin') or
            (secret_target_role == 'migration_runner' and item.role == 'migration')
          - item.role not in ['application-runtime', 'audit-runtime'] or item.gid | int == 10001
        quiet: true
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Verify all declared controller-side sources exist and have Ansible Vault headers
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "test -f \"$1\" && head -c 15 \"$1\" | grep -q '^\\$ANSIBLE_VAULT;'"
          - validate-vault-source
          - "{{ item.source }}"
      delegate_to: localhost
      become: false
      changed_when: false
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Compute a stable generation identifier from encrypted source bytes
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ item.source }}"
      delegate_to: localhost
      become: false
      changed_when: false
      loop: "{{ vault_bundles | sort(attribute='generation_path') }}"
      register: vault_source_checksums
      no_log: true

    - name: Set generation paths
      ansible.builtin.set_fact:
        secret_generation_id: "{{ (vault_source_checksums.results | map(attribute='stdout') | map('regex_replace', ' .*$', '') | join('') ~ (vault_bundles | to_json)) | hash('sha256') }}"
        secret_role_root: "{{ secret_role_roots[secret_target_role] }}"
      no_log: true

    - name: Inspect active generation
      ansible.builtin.stat:
        path: "{{ secret_role_root }}/active"
        follow: false
      register: active_secret_generation
      no_log: true

    - name: Stage, validate, and activate one complete generation
      when: not (active_secret_generation.stat.islnk | default(false) and active_secret_generation.stat.lnk_source == ('generations/' ~ secret_generation_id))
      block:
        - name: Create private generation staging root
          ansible.builtin.file:
            path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}"
            state: directory
            owner: root
            group: root
            mode: "0711"
          no_log: true

        - name: Create each role-scoped directory in the inactive generation
          ansible.builtin.file:
            path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}/{{ item.generation_path | dirname }}"
            state: directory
            owner: root
            group: "{{ item.gid | int }}"
            mode: "0750"
          loop: "{{ vault_bundles }}"
          no_log: true

        - name: Decrypt every bundle into the inactive generation
          ansible.builtin.copy:
            src: "{{ item.source }}"
            dest: "{{ secret_role_root }}/generations/{{ secret_generation_id }}/{{ item.generation_path }}"
            owner: root
            group: "{{ item.gid | int }}"
            mode: "0440"
            decrypt: true
            backup: false
          loop: "{{ vault_bundles }}"
          diff: false
          no_log: true

        - name: Verify every staged bundle is a regular file with the expected numeric group and mode
          ansible.builtin.stat:
            path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}/{{ item.generation_path }}"
            follow: false
          loop: "{{ vault_bundles }}"
          register: staged_bundles
          no_log: true

        - name: Reject incomplete or incorrectly permissioned generations
          ansible.builtin.assert:
            that:
              - item.stat.isreg | default(false)
              - item.stat.pw_name == 'root'
              - item.stat.gid | int == item.item.gid | int
              - item.stat.mode == '0440'
            quiet: true
          loop: "{{ staged_bundles.results }}"
          no_log: true

        - name: Atomically activate the fully staged generation
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/activate-secret-generation.sh
              {{ secret_role_root }} {{ secret_generation_id }}
              {{ vault_bundles | map(attribute='generation_path') | join(' ') }}
          changed_when: true
          no_log: true

      rescue:
        - name: Remove failed inactive generation without touching the active generation
          ansible.builtin.file:
            path: "{{ secret_role_root }}/generations/{{ secret_generation_id }}"
            state: absent
          no_log: true

        - name: Fail deployment after removing the incomplete generation
          ansible.builtin.fail:
            msg: Secret bundle staging failed; active generation was not changed.
          no_log: true
