---
- name: Install encrypted, role-scoped Auto-Parto secret bundles
  hosts: secret_bundle_targets
  gather_facts: false
  become: true
  serial: 1

  tasks:
    - name: Require one or more declared bundles for this host
      ansible.builtin.assert:
        that:
          - vault_bundles is defined
          - vault_bundles is sequence
          - vault_bundles is not string
          - vault_bundles | length > 0
          - secret_target_role is defined
          - secret_target_role in ['application', 'application_database', 'audit_database', 'object_storage', 'migration_runner']
        quiet: true
      no_log: true

    - name: Require complete bundle metadata
      ansible.builtin.assert:
        that:
          - item.source is defined
          - item.role is defined
          - item.destination is defined
          - item.group is defined
          - item.destination is match('^/')
          - >-
            (secret_target_role == 'application' and item.role in ['application-runtime', 'audit-runtime']) or
            (secret_target_role == 'application_database' and item.role in ['database-bootstrap', 'backup']) or
            (secret_target_role == 'audit_database' and item.role == 'audit-admin') or
            (secret_target_role == 'object_storage' and item.role == 'object-storage-admin') or
            (secret_target_role == 'migration_runner' and item.role == 'migration')
        quiet: true
      loop: "{{ vault_bundles | default([]) }}"
      no_log: true

    - name: Require each source to be encrypted with Ansible Vault
      ansible.builtin.command:
        argv:
          - head
          - -c
          - "15"
          - "{{ item.source }}"
      delegate_to: localhost
      become: false
      changed_when: false
      loop: "{{ vault_bundles }}"
      register: vault_headers
      no_log: true

    - name: Reject plaintext or malformed secret bundle sources
      ansible.builtin.assert:
        that:
          - item.stdout.startswith('$ANSIBLE_VAULT;')
        quiet: true
      loop: "{{ vault_headers.results }}"
      no_log: true

    - name: Create private runtime secret directories
      ansible.builtin.file:
        path: "{{ item.destination | dirname }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ vault_bundles }}"
      no_log: true

    - name: Atomically install decrypted role-scoped bundles
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.destination }}"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
        decrypt: true
        backup: false
      loop: "{{ vault_bundles }}"
      diff: false
      no_log: true

    - name: Verify installed bundle ownership and mode without reading contents
      ansible.builtin.stat:
        path: "{{ item.destination }}"
        follow: false
      loop: "{{ vault_bundles }}"
      register: installed_bundles
      no_log: true

    - name: Require root-owned, group-readable regular secret files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == item.item.group
          - item.stat.mode == '0440'
        quiet: true
      loop: "{{ installed_bundles.results }}"
      no_log: true
