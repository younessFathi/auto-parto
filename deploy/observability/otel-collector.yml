receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/docker:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    include_file_path: false
    operators:
      - id: docker-parser
        type: container
      - id: json-parser
        type: json_parser
        parse_from: body
        on_error: drop
      - id: remove-sensitive-fields
        type: remove
        field: attributes.authorization
      - id: remove-token-field
        type: remove
        field: attributes.token
      - id: remove-payload-field
        type: remove
        field: attributes.payload
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  batch:
    send_batch_size: 512
    timeout: 5s
  transform/redact:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(?i)(bearer\\s+)[A-Za-z0-9._~-]+", "$$1[REDACTED]")
          - replace_pattern(body, "(?i)(token|password|secret|api[_-]?key)(\\\"?\\s*[:=]\\s*\\\"?)[^\\\"\\s,}]+", "$$1$$2[REDACTED]")
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [filelog/docker]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [otlphttp/loki]
