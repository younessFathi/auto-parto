services:
  audit-postgresql:
    image: postgres:16-alpine
    profiles: ["audit"]
    environment:
      POSTGRES_DB: ${AUDIT_POSTGRES_DB:-auto_parto_audit}
      POSTGRES_USER: ${AUDIT_POSTGRES_USER:-auto_parto_audit}
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?set AUDIT_POSTGRES_PASSWORD for the audit profile}
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - app-network
    healthcheck:
      test: pg_isready -U ${AUDIT_POSTGRES_USER:-auto_parto_audit} -d ${AUDIT_POSTGRES_DB:-auto_parto_audit}
      interval: 10s
      timeout: 5s
      retries: 5

  audit-postgresql-migrate:
    image: flyway/flyway:10.20.1
    profiles: ["audit"]
    command: ["migrate"]
    environment:
      FLYWAY_URL: ${AUDIT_POSTGRES_JDBC_URL:-jdbc:postgresql://audit-postgresql:5432/auto_parto_audit}
      FLYWAY_USER: ${AUDIT_POSTGRES_MIGRATION_USER:?set AUDIT_POSTGRES_MIGRATION_USER for the audit profile}
      FLYWAY_PASSWORD: ${AUDIT_POSTGRES_MIGRATION_PASSWORD:?set AUDIT_POSTGRES_MIGRATION_PASSWORD for the audit profile}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./src/main/resources/db/audit-migration:/flyway/sql:ro
    depends_on:
      audit-postgresql:
        condition: service_healthy

volumes:
  audit-postgres-data:

networks:
  app-network:
    driver: bridge
