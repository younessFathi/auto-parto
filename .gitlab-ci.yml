image: maven:3.9.10-eclipse-temurin-21

stages:
  - build
  - test
  - cutover-gate
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository" # Use a local Maven repo for caching
  # JWT_SECRET must be set as a CI/CD variable (Settings → CI/CD → Variables) with type "Masked"
  # Generate one with: openssl rand -base64 32

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository # Cache Maven dependencies

build:
  stage: build
  script:
    - echo "Starting Build..."
    - mvn -B -e clean compile

test:
  stage: test
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - echo "Running Tests..."
    - mvn -B -e clean test || (echo "Surefire reports:" && ls -la target/surefire-reports && sed -n '1,200p' target/surefire-reports/*.txt && exit 1)
  artifacts:
    reports:
      junit: target/surefire-reports/*.xml # Store test results for GitLab visualization
    expire_in: 1 day

integration-test:
  stage: test
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - mvn -B -e clean verify || (echo "Failsafe reports:" && ls -la target/failsafe-reports && sed -n '1,200p' target/failsafe-reports/*.txt && exit 1)
  artifacts:
    reports:
      junit: target/failsafe-reports/*.xml
    expire_in: 1 day

postgresql-migration-gate:
  stage: cutover-gate
  image: flyway/flyway:10.20.1
  rules:
    - if: '$APP_POSTGRES_CUTOVER_GATE == "true"'
  script:
    - test -n "$APP_POSTGRES_MIGRATION_JDBC_URL"
    - test -n "$APP_POSTGRES_MIGRATION_USER"
    - test -n "$APP_POSTGRES_MIGRATION_PASSWORD"
    - FLYWAY_URL="$APP_POSTGRES_MIGRATION_JDBC_URL" FLYWAY_USER="$APP_POSTGRES_MIGRATION_USER" FLYWAY_PASSWORD="$APP_POSTGRES_MIGRATION_PASSWORD" FLYWAY_LOCATIONS=filesystem:./src/main/resources/db/migration flyway migrate

postgresql-reconciliation-gate:
  stage: cutover-gate
  image: postgres:16-alpine
  needs: [postgresql-migration-gate]
  rules:
    - if: '$APP_POSTGRES_CUTOVER_GATE == "true"'
  script:
    - test -n "$APP_POSTGRES_RUNTIME_HOST"
    - test -n "$APP_POSTGRES_RUNTIME_DB"
    - test -n "$APP_POSTGRES_RUNTIME_USER"
    - test -n "$APP_POSTGRES_RUNTIME_PASSWORD"
    - PGPASSWORD="$APP_POSTGRES_RUNTIME_PASSWORD" PGHOST="$APP_POSTGRES_RUNTIME_HOST" PGDATABASE="$APP_POSTGRES_RUNTIME_DB" PGUSER="$APP_POSTGRES_RUNTIME_USER" psql --set ON_ERROR_STOP=1 --file deploy/postgres/fixtures/identity-fixtures.sql
    - PGPASSWORD="$APP_POSTGRES_RUNTIME_PASSWORD" PGHOST="$APP_POSTGRES_RUNTIME_HOST" PGDATABASE="$APP_POSTGRES_RUNTIME_DB" PGUSER="$APP_POSTGRES_RUNTIME_USER" bash deploy/postgres/operations/reconcile-development-fixtures.sh

postgresql-cutover-preflight:
  stage: cutover-gate
  image: bash:5.2
  needs: [postgresql-reconciliation-gate]
  rules:
    - if: '$APP_POSTGRES_CUTOVER_GATE == "true"'
  script:
    - bash deploy/postgres/operations/preflight-cutover.sh

package:
  stage: package
  script:
    - echo "Packaging Application..."
    - mvn -B -e clean package -DskipTests
