services:
  mongo:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass your_redis_password
    volumes:
      - redis_data:/data
    networks:
      - app-network

  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-parto-springboot-app:latest
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - redis
    networks:
      - app-network
    environment:
      SPRING_DATA_MONGODB_URI: ${URI}

volumes:
  mongo-data:
  redis_data:

networks:
  app-network:
    driver: bridge
