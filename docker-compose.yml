services:
  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-parto-springboot-app:latest
    expose:
      - "8080"
    environment:
      SPRING_R2DBC_URL: ${APP_POSTGRES_R2DBC_URL:-r2dbc:postgresql://app-postgresql:5432/auto_parto}
      SPRING_R2DBC_USERNAME: ${APP_POSTGRES_RUNTIME_USER:-auto_parto_runtime}
      SPRING_R2DBC_PASSWORD: ${APP_POSTGRES_RUNTIME_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      OTP_PEPPER: local-development-pepper
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  springboot-postgresql-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-parto-springboot-app:postgresql
    profiles: ["postgres"]
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_R2DBC_URL: r2dbc:postgresql://app-postgresql:5432/${APP_POSTGRES_DB:-auto_parto}
      SPRING_R2DBC_USERNAME: ${APP_POSTGRES_RUNTIME_USER:-auto_parto_runtime}
      SPRING_R2DBC_PASSWORD: ${APP_POSTGRES_RUNTIME_PASSWORD:?set APP_POSTGRES_RUNTIME_PASSWORD for the postgres profile}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      APP_POSTGRES_R2DBC_ENABLED: "true"
      OTP_PEPPER: local-development-pepper
      APP_POSTGRES_IDENTITY_ENABLED: "true"
      APP_POSTGRES_BUYER_IDENTITY_ENABLED: "true"
      APP_POSTGRES_MARKETPLACE_ENABLED: "true"
      APP_POSTGRES_WALLET_ENABLED: "true"
      APP_POSTGRES_DEVICE_TOKENS_ENABLED: "true"
      APP_POSTGRES_NOTIFICATIONS_ENABLED: "true"
      APP_POSTGRES_FILES_ENABLED: "true"
      APP_POSTGRES_NOTIFICATION_PREFERENCES_ENABLED: "true"
      APP_POSTGRES_CUTOVER_ENABLED: "true"
      APP_POSTGRES_CUTOVER_API_CONTRACTS_READY: "true"
      APP_POSTGRES_CUTOVER_STORAGE_RECONCILIATION_ENABLED: "true"
      APP_FILE_STORAGE_PROVIDER: local
      APP_FILE_STORAGE_LOCAL_ROOT: /uploads
      FIREBASE_ENABLED: "false"
      APP_FIREBASE_COMPONENTS_ENABLED: "false"
      RESEND_API_KEY: local-development-disabled
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    volumes:
      - ./uploads:/uploads
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - app-network
    healthcheck:
      test: wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    depends_on:
      app-postgresql-fixtures:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: redis-cli -a '${REDIS_PASSWORD:-password}' ping
      interval: 10s
      timeout: 5s
      retries: 5

  app-postgresql:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-auto_parto}
      POSTGRES_USER: ${APP_POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${APP_POSTGRES_BOOTSTRAP_PASSWORD:?set APP_POSTGRES_BOOTSTRAP_PASSWORD for the postgres profile}
      APP_POSTGRES_RUNTIME_USER: ${APP_POSTGRES_RUNTIME_USER:-auto_parto_runtime}
      APP_POSTGRES_RUNTIME_PASSWORD: ${APP_POSTGRES_RUNTIME_PASSWORD:?set APP_POSTGRES_RUNTIME_PASSWORD for the postgres profile}
      APP_POSTGRES_MIGRATION_USER: ${APP_POSTGRES_MIGRATION_USER:?set APP_POSTGRES_MIGRATION_USER for the postgres profile}
      APP_POSTGRES_MIGRATION_PASSWORD: ${APP_POSTGRES_MIGRATION_PASSWORD:?set APP_POSTGRES_MIGRATION_PASSWORD for the postgres profile}
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - app-network
    healthcheck:
      test: pg_isready -U ${APP_POSTGRES_BOOTSTRAP_USER:-postgres} -d ${APP_POSTGRES_DB:-auto_parto}
      interval: 10s
      timeout: 5s
      retries: 5

  app-postgresql-migrate:
    image: flyway/flyway:10.20.1
    profiles: ["postgres"]
    command: ["migrate"]
    environment:
      FLYWAY_URL: ${APP_POSTGRES_JDBC_URL:-jdbc:postgresql://app-postgresql:5432/auto_parto}
      FLYWAY_USER: ${APP_POSTGRES_MIGRATION_USER:?set APP_POSTGRES_MIGRATION_USER for the postgres profile}
      FLYWAY_PASSWORD: ${APP_POSTGRES_MIGRATION_PASSWORD:?set APP_POSTGRES_MIGRATION_PASSWORD for the postgres profile}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      app-postgresql:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  app-postgresql-fixtures:
    image: postgres:16-alpine
    profiles: ["postgres"]
    command: ["psql", "--set", "ON_ERROR_STOP=1", "--file", "/fixtures/identity-fixtures.sql"]
    environment:
      PGHOST: app-postgresql
      PGDATABASE: ${APP_POSTGRES_DB:-auto_parto}
      PGUSER: ${APP_POSTGRES_RUNTIME_USER:-auto_parto_runtime}
      PGPASSWORD: ${APP_POSTGRES_RUNTIME_PASSWORD:?set APP_POSTGRES_RUNTIME_PASSWORD for the postgres profile}
    volumes:
      - ./deploy/postgres/fixtures:/fixtures:ro
    depends_on:
      app-postgresql-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app-network

volumes:
  redis_data:
  app-postgres-data:

networks:
  app-network:
    driver: bridge
