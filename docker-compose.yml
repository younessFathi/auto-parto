services:
  mongo:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  springboot-app:
    build: .
    env_file:
      - .env
    image: auto-parto-springboot-app:latest
    ports:
      - "8080:8080"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - mongo
      - redis
    networks:
      - app-network
    environment:
      SPRING_DATA_MONGODB_URI: ${URI}
      MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

volumes:
  mongo-data:
  redis_data:

networks:
  app-network:
    driver: bridge
