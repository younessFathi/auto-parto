services:
  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-parto-springboot-app:latest
    container_name: springboot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://root:root@mongo:27017/auto-parto?authSource=admin}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-that-is-256-bits-long!}
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: redis-cli -a '${REDIS_PASSWORD:-password}' ping
      interval: 10s
      timeout: 5s
      retries: 5

  app-postgresql:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-auto_parto}
      POSTGRES_USER: ${APP_POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${APP_POSTGRES_BOOTSTRAP_PASSWORD:?set APP_POSTGRES_BOOTSTRAP_PASSWORD for the postgres profile}
      APP_POSTGRES_RUNTIME_USER: ${APP_POSTGRES_RUNTIME_USER:-auto_parto_runtime}
      APP_POSTGRES_RUNTIME_PASSWORD: ${APP_POSTGRES_RUNTIME_PASSWORD:?set APP_POSTGRES_RUNTIME_PASSWORD for the postgres profile}
      APP_POSTGRES_MIGRATION_USER: ${APP_POSTGRES_MIGRATION_USER:?set APP_POSTGRES_MIGRATION_USER for the postgres profile}
      APP_POSTGRES_MIGRATION_PASSWORD: ${APP_POSTGRES_MIGRATION_PASSWORD:?set APP_POSTGRES_MIGRATION_PASSWORD for the postgres profile}
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - app-network
    healthcheck:
      test: pg_isready -U ${APP_POSTGRES_BOOTSTRAP_USER:-postgres} -d ${APP_POSTGRES_DB:-auto_parto}
      interval: 10s
      timeout: 5s
      retries: 5

  app-postgresql-migrate:
    image: flyway/flyway:10.20.1
    profiles: ["postgres"]
    command: ["migrate"]
    environment:
      FLYWAY_URL: ${APP_POSTGRES_JDBC_URL:-jdbc:postgresql://app-postgresql:5432/auto_parto}
      FLYWAY_USER: ${APP_POSTGRES_MIGRATION_USER:?set APP_POSTGRES_MIGRATION_USER for the postgres profile}
      FLYWAY_PASSWORD: ${APP_POSTGRES_MIGRATION_PASSWORD:?set APP_POSTGRES_MIGRATION_PASSWORD for the postgres profile}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      app-postgresql:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

volumes:
  mongo-data:
  redis_data:
  app-postgres-data:

networks:
  app-network:
    driver: bridge
